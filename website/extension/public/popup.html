<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0f0f13;
        color: #e5e5ea;
        margin: 0;
        min-width: 220px;
        padding: 14px 16px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px;
        letter-spacing: 0.04em;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        padding: 3px 0;
        color: #a1a1aa;
      }
      .row span:last-child {
        color: #e5e5ea;
      }
      .connected {
        color: #4ade80;
      }
      .waiting {
        color: #facc15;
      }
      a {
        color: #60a5fa;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>SyncFlix</h1>
    <div class="row"><span>Status</span><span id="status">…</span></div>
    <div class="row"><span>Platform</span><span id="platform">—</span></div>
    <div class="row"><span>Room tab</span><span id="roomTabs">—</span></div>
    <div class="row"><span>Video tab</span><span id="playerTabs">—</span></div>
    <div class="row"><span>Version</span><span id="version">—</span></div>
    <div class="row" id="openVideoRow" style="display: none">
      <span>Host's video</span><a id="openVideo" href="#">Open video</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
